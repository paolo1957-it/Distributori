name: App Android (Android Auto)

# Compila l'app Android ed esegue i test della logica su un computer Linux di GitHub.
# Il file APK di prova (firmato con una chiave di debug) si scarica dalla pagina dell'esecuzione,
# alla voce "Artifacts". Istruzioni in android/ANDROID.md.
on:
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  compila:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test della logica e compilazione dell'APK di prova
        env:
          NUMERO_BUILD: ${{ github.run_number }}
        run: ./gradlew --no-daemon :core:test :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: qui-distributori-prova-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
