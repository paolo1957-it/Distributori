# Temporaneo: confronto MIMIT–OSM per la Lombardia. Gira solo sul ramo di lavoro, non pubblica niente.
name: Confronto MIMIT-OSM (Lombardia)
on:
  push:
    branches: [claude/project-thread-r8zrz0]
    paths: [strumenti/confronta_osm.py, .github/workflows/confronto-osm.yml]
permissions:
  contents: read
jobs:
  confronto:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: python3 strumenti/confronta_osm.py
      - name: Stampa il CSV nel registro
        if: always()
        run: cat confronto_osm.csv || true
